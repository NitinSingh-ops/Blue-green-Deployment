apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      version: green
  template:
    metadata:
      labels:
        app: frontend
        version: green
    spec:
      containers:
      - name: frontend
        image: bluegreen/frontend-green:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3200
        env:
        - name: PORT
          value: "3200"
        readinessProbe:
          httpGet:
            path: /health
            port: 3200
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3200
          initialDelaySeconds: 15
          periodSeconds: 10
